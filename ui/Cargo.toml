[package]
name = "dlkit"
version = "0.2.0"
edition = "2021"
description = "DLKit - 多功能下载器"
license = "MIT"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tray-icon = "0.26.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "http2", "charset"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
