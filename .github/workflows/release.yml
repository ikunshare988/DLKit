name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Sigstore 无密钥签名需要 OIDC 令牌
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui

      - name: 编译
        working-directory: ui
        run: cargo build --release --locked

      - name: 打包并计算校验值
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ui\target\release\dlkit.exe dist\DLKit.exe
          $hash = (Get-FileHash dist\DLKit.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DLKit.exe" | Set-Content -Encoding ascii dist\SHA256.txt
          Get-Content dist\SHA256.txt

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      - name: Sigstore 无密钥签名
        shell: pwsh
        run: |
          # 证书里会记录本仓库、本工作流和 tag，任何人都能离线验证签名来源
          cosign sign-blob --yes --bundle dist\DLKit.exe.bundle dist\DLKit.exe
          Get-ChildItem dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DLKit.exe
            dist/SHA256.txt
            dist/DLKit.exe.bundle
          generate_release_notes: true
